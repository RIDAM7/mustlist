name: Release CLI

# Publishes the `mustlist` CLI to npm when packages/cli/package.json gets a new
# version on main, with npm trusted publishing (OIDC): no npm token is stored
# anywhere, and npm adds a provenance statement automatically. Then it tags the
# release on GitHub. Cards don't need a release: the CLI fetches them live.
on:
  push:
    branches: [main]
    paths: ['packages/cli/package.json']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the GitHub release and tag
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Is this version new?
        id: version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "mustlist@$version" version > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "mustlist@$version is already on npm; nothing to publish."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (trusted publishing)
        if: steps.version.outputs.new == 'true'
        run: pnpm --filter mustlist publish --access public --no-git-checks

      - name: GitHub release
        if: steps.version.outputs.new == 'true'
        run: gh release create "cli-v$VERSION" --title "mustlist $VERSION" --generate-notes --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
